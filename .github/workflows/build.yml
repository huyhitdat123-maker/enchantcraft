name: Build EnchantCraft 1.21.11

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Biên dịch bằng Maven
        run: mvn -B clean package --file pom.xml

      - name: Xuất file JAR
        uses: actions/upload-artifact@v4
        with:
          name: EnchantCraft-1.21.11
          path: target/EnchantCraft-*.jar
