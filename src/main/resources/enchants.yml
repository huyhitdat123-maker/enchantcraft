# ==============================================================================
# KHO PHÙ PHÉP ENCHANTCRAFT (ALL-IN-ONE)
# Sửa xong bấm Lưu (Save) trên hosting rồi vào game gõ: /ec reload
# ==============================================================================
# CÁC TỪ KHÓA HỖ TRỢ SẴN:
# - target: SWORD, AXE, WEAPON, BOW, PICKAXE, SHOVEL, TOOL, HELMET, CHESTPLATE, LEGGINGS, BOOTS, ARMOR, ALL
# - trigger: ATTACK (chém/bắn trúng), DEFEND (bị đánh), MINE (đào block), INTERACT (chuột phải), SNEAK (bấm Shift), PASSIVE (bị động mỗi 2s)
# - actions:
#   + Đào mỏ: MINE_3X3 | VEIN_MINE:<số_block> | AUTO_SMELT | MAGNET | EXP_BOOST:<số_exp>
#   + Chiến đấu: HEAL:<máu> | LIFESTEAL:<tỉ_lệ_0.1_1.0> | DAMAGE:<sát_thương> | CLEAVE:<bán_kính>:<sát_thương>
#   + Nguyên tố: LIGHTNING | LIGHTNING_EFFECT | EXPLODE:<độ_lớn> | IGNITE:<ticks> | FREEZE:<ticks> | ARROW_RAIN:<số_tên>
#   + Di chuyển: DASH:<lực> | LEAP:<lực_tới>:<lực_nhảy> | LAUNCH:<lực_hất_tung> | PULL:<lực_kéo> | TELEPORT_HIT | FIREBALL
#   + Hiệu ứng: POTION_SELF:<tên>:<cấp>:<ticks> | POTION_TARGET:<tên>:<cấp>:<ticks> | SOUND:<tên> | PARTICLE:<tên>:<số_lượng> | ACTIONBAR:<chữ>
# ==============================================================================

